name: paper-trading
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */4 * * *"   # 7 min después de cada cierre de vela de 4 h (UTC)
permissions:
  contents: write
concurrency: { group: paper, cancel-in-progress: false }
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python paper.py
      - name: Guardar estado
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "paper: $(date -u +%F' '%H:%M)" && git push)
